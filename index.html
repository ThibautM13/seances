<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">

<title>Mes séances</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Concept : appli d'entraînement claire, cartes blanches sur fond gris très clair. Titres et chiffres condensés façon tableau d'affichage, vidéo en vedette, barre d'onglets en bas. */
:root{
 --bg:#f3f5f8;--s1:#ffffff;--s2:#eef1f5;--ln:#dfe4ea;
 --tx:#14202e;--mu:#5f6c7b;--ac:#2563eb;--danger:#d33a3a;
 --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
 --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
 color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:600;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
h1{font-size:36px}h2{font-size:22px}h3{font-size:20px}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.ro{padding-bottom:40px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ac)}
.mu{color:var(--mu);font-size:13px}
.pre{white-space:pre-line}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top .mu{margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:1px solid transparent;border-radius:12px;background:var(--ac);color:#fff;font-weight:600}
.btn.ghost{background:var(--s2);border-color:var(--ln);color:var(--tx)}
.btn.dg{background:var(--danger);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);flex:none}
.ib.dg{color:var(--danger)}
.ic{flex:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--s2);color:var(--tx);font:inherit;font-size:16px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1;min-width:0}
.sb{position:relative}
.sb .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu)}
.sb input{padding-left:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.multi{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;background:hsl(var(--h) 70% 50%/.13);color:hsl(var(--h) 70% 28%)}
.tg::before{content:"";width:6px;height:6px;border-radius:50%;background:hsl(var(--h) 75% 45%)}
.tg.pp{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}
.tg.pp::before{display:none}
.seg{display:flex;flex:1;padding:4px;background:var(--s2);border:1px solid var(--ln);border-radius:14px;gap:4px}
.seg button{flex:1;padding:8px;border:0;border-radius:10px;background:transparent;color:var(--mu);font-weight:600}
.seg button.on{background:var(--ac);color:#fff}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.media{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#dde6f2,#c9d6e6);flex:none;color:#fff}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media.sm{width:84px}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(13,17,23,.62);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;color:#fff;padding-left:3px}
.fol{margin-bottom:22px;border-radius:16px}
.fh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fh h2{flex:1;min-width:0;overflow-wrap:anywhere}
.fh>.ic{color:var(--ac)}
.cnt{font-size:13px;color:var(--mu);background:var(--s2);border-radius:999px;padding:2px 9px}
.srow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:10px 10px 10px 14px;margin-bottom:8px;cursor:grab}
.sbody{flex:1 1 150px;min-width:0;text-align:left;background:none;border:0;padding:6px 0;color:inherit}
.sbody h3{overflow-wrap:anywhere}
.sact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
select.mv{width:auto;max-width:150px;padding:8px 10px;font-size:14px}
.card,.xc,.lc,.srow{box-shadow:0 1px 2px rgba(20,32,46,.06),0 4px 14px rgba(20,32,46,.04)}
.empty{border:1px dashed var(--ln);border-radius:16px;padding:20px;text-align:center;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lc{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mw{position:relative}
.mo{position:absolute;top:5px;right:5px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:rgba(255,255,255,.9);color:var(--tx);box-shadow:0 1px 4px rgba(20,32,46,.25)}
.lc .lb{display:flex;flex-direction:column;gap:3px;padding:2px 4px 4px;min-width:0;cursor:pointer;flex:1}
.lc h3{font-size:17px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lpl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mu);min-width:0}
.lpl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltg{display:flex;gap:4px;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.ltg .tg{flex:none;padding:1px 8px;font-size:11px}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.menu .btn{justify-content:flex-start}
.menu .dgt{color:var(--danger)}
.ban{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff4e5;border:1px solid #f1c27a;color:#5b3a00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.ban:empty{display:none}
.sd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--mu)}
.sd.ok{background:#1f9d62}.sd.bad{background:var(--danger)}.sd.wait{background:#e0a020}
.xr{padding:10px}
.xh{display:flex;gap:12px;align-items:center;cursor:pointer}
.xm{flex:1;min-width:0}
.xm h3{font-size:19px;overflow-wrap:anywhere}
.sum{color:var(--mu);font-size:14px;margin-top:2px}
.chv{transition:transform .2s;color:var(--mu);display:flex}
.chv.up{transform:rotate(180deg)}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:0 10px;margin-top:6px}
.xa{display:flex;gap:8px;margin-top:12px}
.hero{padding:18px;background:linear-gradient(160deg,#e6efff,#ffffff 70%)}
.hero h1{font-size:40px}
.pm{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pm span{background:var(--s2);border:1px solid var(--ln);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--mu)}
.xc{background:var(--s1);border:1px solid var(--ln);border-radius:18px;overflow:hidden;margin-bottom:14px}
.xc .media{border-radius:0;width:100%}
.xb{padding:14px;display:flex;flex-direction:column;gap:12px}
.xt{display:flex;gap:12px;align-items:center}
.xt h3{min-width:0;overflow-wrap:anywhere}
.num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:700;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.st{background:var(--s2);border-radius:12px;padding:8px 12px;min-width:0}
.st b{display:block;font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.05;overflow-wrap:anywhere}
.st span{font-size:12px;color:var(--mu)}
.cons{opacity:.9}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;color:var(--ac);padding:2px 0;font-weight:500;align-self:flex-start}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;background:none;border:0;color:var(--mu);font-size:12px;font-weight:500}
.tabs button.on{color:var(--ac)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.74);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border:1px solid var(--ln);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
@media(min-width:640px){.ov{align-items:center;padding:16px}.sheet{border-radius:20px}.fg{grid-template-columns:repeat(4,1fr)}}
.vbox{width:100%;max-width:760px;padding:10px;background:var(--s1);border-radius:18px;margin:auto}
.vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pkrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.pkrow .media{width:96px}
.pkrow .xm{display:flex;flex-direction:column;gap:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 :root{--bg:#fff;--s1:#fff;--s2:#f1f3f6;--ln:#d3d8df;--tx:#111;--mu:#555;--ac:#1f5fd6;color-scheme:light}
 .tabs,.noprint,.ov{display:none!important}
 .wrap{padding:0;max-width:none}
 .xc,.hero{break-inside:avoid}
 .hero{background:#fff}
 .clamp{display:block;-webkit-line-clamp:unset}
 .more{display:none}
 .tg{color:#222;background:#eee}.tg::before{background:#666}
}
</style></head><body>
<div id="app" class="wrap"><div id="v"></div></div>
<nav class="tabs noprint" id="tabs" aria-label="Navigation"></nav>
<div id="m"></div>
<script>
var S={tab:"ses",lib:[],sessions:[],folders:[],cur:null,mode:"edit",open:-1,edit:null,flt:[],fltP:[],q:"",modal:null,pk:{q:"",tags:[],pl:[]},ro:false,ses:null};
var KEY="seances-v3",dlgCb=null,dlgAlt=null,dragId=null,HUES=[210,160,28,285,340,48,190,100];
var IC={
 ses:'<path d="M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
 lib:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9.5v5l4.2-2.5z"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 chev:'<path d="M6 9l6 6 6-6"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 trash:'<path d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>',
 up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
 down:'<path d="M12 5v14M6 13l6 6 6-6"/>',
 search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
 share:'<path d="M12 4v11M7 9l5-5 5 5M5 14v5h14v-5"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',
 more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
 sliders:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/>'
};
function ic(n,s){return'<svg class="ic" width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+"</svg>"}
function snap(){return{lib:S.lib,sessions:S.sessions,folders:S.folders}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(snap()))}catch(e){}syDirty()}
function vidId(u){var m=String(u||"").match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:""}
function sv(v){return /^[\w-]{11}$/.test(v||"")?v:""}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))}
function hue(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return HUES[h%HUES.length]}
function tg(t){return'<span class="tg" style="--h:'+hue(t)+'">'+esc(t)+"</span>"}
function pp(n){return'<span class="tg pp">'+ic("user",12)+esc(n)+"</span>"}
function badges(x){var t=(x.tags||[]).map(function(g){return tg(g)}).join("");return t?'<div class="tags">'+t+"</div>":""}
function load(){
 if(location.hash.indexOf("#s=")==0){try{var d=dec(location.hash.slice(3));S.ro=true;S.mode="prev";S.ses={title:d.t,player:d.p,items:d.i};return}catch(e){}}
 try{var x=JSON.parse(localStorage.getItem(KEY)||"null");
  if(x){S.lib=x.lib||[];S.sessions=x.sessions||[];S.folders=x.folders||[]}
  else{var o=JSON.parse(localStorage.getItem("seances-v2")||"null");
   if(o){S.lib=o.lib||[];if(o.ses&&o.ses.items&&o.ses.items.length)S.sessions=[{id:Date.now(),title:o.ses.title||"Séance 1",player:o.ses.player||"",folder:"",items:o.ses.items}]}}}catch(e){}
 S.lib.forEach(function(e){if(!e.tags)e.tags=[];if(!e.players)e.players=[]})}
function ex(id){return S.lib.filter(function(e){return e.id==id})[0]}
function curS(){return S.ro?S.ses:S.sessions.filter(function(s){return s.id==S.cur})[0]}
function allVals(k,extra){var t=[];S.lib.forEach(function(e){(e[k]||[]).forEach(function(g){if(t.indexOf(g)<0)t.push(g)})});(extra||[]).forEach(function(g){if(t.indexOf(g)<0)t.push(g)});return t.sort(function(a,b){return a.localeCompare(b,"fr")})}
function allTags(extra){return allVals("tags",extra)}
function allPlayers(extra){return allVals("players",extra)}
function filtered(q,tags,pl){q=(q||"").toLowerCase();pl=pl||[];return S.lib.filter(function(e){var ep=e.players||[];return(!q||e.name.toLowerCase().indexOf(q)>-1||e.tags.some(function(g){return g.indexOf(q)>-1})||ep.some(function(g){return g.toLowerCase().indexOf(q)>-1}))&&tags.every(function(t){return e.tags.indexOf(t)>-1})&&pl.every(function(t){return ep.indexOf(t)>-1})})}
function toggle(arr,v){var i=arr.indexOf(v);if(i>-1)arr.splice(i,1);else arr.push(v)}
function chips(list,sel,attr,cls,id,pre){return'<div class="chips'+(cls?" "+cls:"")+'"'+(id?' id="'+id+'"':"")+">"+list.map(function(t){return'<button class="chip'+(sel.indexOf(t)>-1?" on":"")+'" data-a="'+attr+'" data-t="'+esc(t)+'">'+(pre||"")+esc(t)+"</button>"}).join("")+"</div>"}
function media(v,o){o=o||{};v=sv(v);
 var img=v?'<img data-yt="1" src="https://i.ytimg.com/vi/'+v+'/hqdefault.jpg" alt="" loading="lazy">':"";
 var pl=(o.play&&v)?'<span class="pl"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span>':"";
 var ph=v?"":'<span class="ph">'+ic("lib",26)+"</span>";
 var cls="media"+(o.sm?" sm":"");
 if(o.play&&v)return'<a class="'+cls+'" href="https://www.youtube.com/watch?v='+v+'" target="_blank" rel="noopener" data-a="play" data-v="'+v+'" aria-label="Lire la vidéo">'+img+pl+"</a>";
 return'<div class="'+cls+'">'+img+ph+"</div>"}
function render(){
 var tabs=document.getElementById("tabs");tabs.hidden=S.ro;
 tabs.querySelectorAll("button").forEach(function(b){b.className=b.dataset.tab==S.tab?"on":""});
 document.getElementById("app").className="wrap"+(S.ro?" ro":"");
 document.getElementById("v").innerHTML=S.ro?sesPage():S.tab=="set"?setView():S.tab=="lib"?libView():S.cur?sesPage():listView();
 document.getElementById("m").innerHTML=modalView()}
/* ---------- Bibliothèque ---------- */
function exForm(){var e=S.edit;
 return'<div class="card"><h2>'+(e.id?"Modifier l’exercice":"Nouvel exercice")+'</h2><label for="f-video">Lien YouTube</label><div class="row"><input id="f-video" value="'+esc(e.video)+'" placeholder="https://youtu.be/…"><button class="btn ghost" data-a="fetch">Récupérer</button></div><div class="mu" id="f-st"></div>'
 +'<label for="f-name">Nom</label><input id="f-name" value="'+esc(e.name)+'"><label for="f-tips">Consignes d’exécution</label><textarea id="f-tips" rows="5">'+esc(e.tips)+"</textarea>"
 +"<label>Catégories</label>"+chips(allTags(e.tags),e.tags,"ftag","multi")
 +'<div class="row" style="margin-top:10px"><input id="f-newtag" placeholder="Nouvelle catégorie (ex : vitesse)" aria-label="Nouvelle catégorie"><button class="btn ghost" data-a="addtag">Ajouter</button></div>'
 +"<label>Joueur dans la vidéo</label>"+chips(allPlayers(e.players),e.players,"fplayer","multi",null,ic("user",14))
 +'<div class="row" style="margin-top:10px"><input id="f-newplayer" placeholder="Nouveau joueur (ex : Léa)" aria-label="Nouveau joueur"><button class="btn ghost" data-a="addplayer">Ajouter</button></div>'
 +'<div class="row" style="margin-top:14px"><button class="btn" data-a="saveEx">Enregistrer</button><button class="btn ghost" data-a="cancel">Annuler</button></div></div>'}
function libView(){
 var h='<div class="top"><div><h1>Bibliothèque</h1><div class="mu">'+S.lib.length+" exercice"+(S.lib.length>1?"s":"")+'</div></div><button class="btn" data-a="newEx">'+ic("plus",18)+"Ajouter</button></div>";
 h+='<div id="sy-ban">'+banner()+"</div>";if(S.edit)h+=exForm();
 h+='<div class="sb">'+ic("search",18)+'<input id="lib-q" type="search" placeholder="Rechercher un exercice, une catégorie ou un joueur" aria-label="Rechercher" value="'+esc(S.q)+'"></div>';
 var at=allTags(),ap=allPlayers();if(at.length)h+=chips(at,S.flt,"lflt");if(ap.length)h+=chips(ap,S.fltP,"lfltp","",null,ic("user",14));

document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName=="IMG"&&t.dataset&&t.dataset.yt)t.remove()},true);
document.addEventListener("dragstart",function(ev){var c=ev.target.closest&&ev.target.closest("[data-sid]");if(!c)return;dragId=+c.dataset.sid;try{ev.dataTransfer.setData("text/plain",String(dragId));ev.dataTransfer.effectAllowed="move"}catch(e){}});
document.addEventListener("dragover",function(ev){if(dragId==null)return;var d=ev.target.closest("[data-drop]");if(!d)return;ev.preventDefault();document.querySelectorAll("[data-drop]").forEach(function(x){x.style.outline=""});d.style.outline="2px dashed var(--ac)";d.style.outlineOffset="4px"});
document.addEventListener("drop",function(ev){if(dragId==null)return;var d=ev.target.closest("[data-drop]");if(!d)return;ev.preventDefault();var id=dragId;dragId=null;moveSes(id,d.getAttribute("data-drop"))});
document.addEventListener("dragend",function(){dragId=null;document.querySelectorAll("[data-drop]").forEach(function(x){x.style.outline=""})});
/* SYNC START */
var SY={code:"",rev:0,dirty:false,v:0,status:"off",msg:"",conf:null,busy:false,last:0,timer:null},SYK="seances-sync";
function syLoad(){try{var o=JSON.parse(localStorage.getItem(SYK)||"null");if(o){SY.code=o.code||"";SY.rev=o.rev||0;SY.dirty=!!o.dirty}}catch(e){}SY.status=SY.code?"idle":"off"}
function sySave(){try{localStorage.setItem(SYK,JSON.stringify({code:SY.code,rev:SY.rev,dirty:SY.dirty}))}catch(e){}}
function syApi(method,body){
 var o={method:method,headers:{"x-code":SY.code}};
 if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
 return fetch("/.netlify/functions/data",o).then(function(r){return r.json().catch(function(){return{}}).then(function(j){return{st:r.status,j:j}})})}
function errMsg(r){return r.st==404?"La synchronisation n’est pas encore installée sur le site.":((r.j&&r.j.error)||"Erreur du serveur.")}
function hm(t){try{return new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function banner(){if(!SY.code)return"";
 if(SY.status=="conflict")return'<div class="ban"><span>Deux versions différentes de ta bibliothèque existent.</span><button class="btn sm" data-a="syResolve">Choisir</button></div>';
 if(SY.status=="offline")return'<div class="ban"><span>Hors ligne : tes modifications sont gardées sur cet appareil et seront envoyées dès que possible.</span><button class="btn ghost sm" data-a="syNow">Réessayer</button></div>';
 if(SY.status=="error")return'<div class="ban"><span>'+esc(SY.msg||"Erreur de synchronisation.")+'</span><button class="btn ghost sm" data-a="syNow">Réessayer</button></div>';
 return""}
function syPanel(){
 if(!SY.code)return'<label for="sy-code" style="margin-top:0">Code d’accès</label><input id="sy-code" type="password" autocomplete="off" autocapitalize="off" placeholder="Le code choisi dans Netlify"><div class="row" style="margin-top:12px"><button class="btn" data-a="syOn">Activer</button></div>'+(SY.msg?'<div class="mu" style="color:var(--danger);margin-top:8px">'+esc(SY.msg)+"</div>":"");
 var map={ok:["ok","À jour"],saving:["wait","Enregistrement…"],idle:["wait","Connexion…"],offline:["bad","Hors ligne, en attente de réseau"],error:["bad",SY.msg||"Erreur de synchronisation"],conflict:["bad","Deux versions différentes"]},st=map[SY.status]||["wait",""];
 return'<div style="display:flex;align-items:center;margin-bottom:8px"><span class="sd '+st[0]+'"></span><b>'+esc(st[1])+"</b></div>"+(SY.last&&SY.status=="ok"?'<div class="mu" style="margin-bottom:10px">Dernière synchronisation à '+hm(SY.last)+"</div>":"")
 +'<div class="acts" style="margin-bottom:0"><button class="btn ghost sm" data-a="syNow">Synchroniser maintenant</button>'+(SY.status=="conflict"?'<button class="btn sm" data-a="syResolve">Résoudre</button>':"")+'<button class="btn ghost sm" data-a="syOff">Désactiver sur cet appareil</button></div>'}
function syUi(){var b=document.getElementById("sy-ban");if(b)b.innerHTML=banner();var p=document.getElementById("sy-set");if(p)p.innerHTML=syPanel()}
function setView(){
 return'<div class="top"><div><h1>Réglages</h1></div></div>'
 +'<div class="card"><h2>Synchronisation</h2><p class="mu" style="margin:6px 0 12px">Retrouve ta bibliothèque et tes séances sur tous tes appareils. Ton code d’accès protège les données.</p><div id="sy-set">'+syPanel()+"</div></div>"
 +'<div class="card"><h2>Sauvegarde</h2><p class="mu" style="margin:6px 0 12px">Télécharge un fichier avec toute ta bibliothèque, tes séances et tes dossiers, ou restaure une sauvegarde.</p><div class="acts" style="margin-bottom:0"><button class="btn ghost sm" data-a="export">Exporter</button><button class="btn ghost sm" data-a="import">Importer</button></div><input id="imp-file" type="file" accept=".json,application/json" hidden><div class="mu" id="bk-st" style="margin-top:8px"></div></div>'}
function syDirty(){if(!SY.code||S.ro)return;SY.dirty=true;SY.v++;sySave();if(SY.status!="conflict")SY.status="saving";clearTimeout(SY.timer);SY.timer=setTimeout(syPush,1500)}
function syPush(){
 if(!SY.code||SY.busy||!SY.dirty||SY.conf)return;
 var v0=SY.v;SY.busy=true;SY.status="saving";syUi();
 syApi("PUT",{baseRev:SY.rev,data:snap()}).then(function(r){SY.busy=false;
  if(r.st==200){SY.rev=r.j.rev;SY.dirty=(SY.v!==v0);SY.status="ok";SY.last=Date.now();sySave();if(SY.dirty){clearTimeout(SY.timer);SY.timer=setTimeout(syPush,800)}}
  else if(r.st==409){syConflict(r.j)}
  else if(r.st==401){syBadCode()}
  else{SY.status="error";SY.msg=errMsg(r)}
  syUi()}).catch(function(){SY.busy=false;SY.status="offline";syUi()})}
function syPull(){
 if(!SY.code||SY.busy||SY.conf)return;
 SY.busy=true;if(SY.status!="ok")SY.status="idle";syUi();
 syApi("GET").then(function(r){SY.busy=false;
  if(r.st==401)syBadCode();
  else if(r.st!=200){SY.status="error";SY.msg=errMsg(r)}
  else syMerge(r.j);
  syUi()}).catch(function(){SY.busy=false;SY.status="offline";syUi()})}
function syMerge(j){
 var hasLocal=S.lib.length||S.sessions.length||S.folders.length;
 if(!j.data){SY.rev=j.rev;if(hasLocal){SY.dirty=true;SY.v++;sySave();syPush()}else{SY.status="ok";SY.last=Date.now();sySave()}return}
 if(j.rev===SY.rev){if(SY.dirty)syPush();else{SY.status="ok";SY.last=Date.now()}return}
 if(!SY.dirty&&(SY.rev>0||!hasLocal)){applyRemote(j);return}
 syConflict(j)}
function applyRemote(j){var d=j.data||{};S.lib=d.lib||[];S.sessions=d.sessions||[];S.folders=d.folders||[];
 S.lib.forEach(function(e){if(!e.tags)e.tags=[];if(!e.players)e.players=[]});
 try{localStorage.setItem(KEY,JSON.stringify(snap()))}catch(e){}
 SY.conf=null;SY.rev=j.rev;SY.dirty=false;SY.status="ok";SY.last=Date.now();sySave();
 if(S.cur&&!S.sessions.some(function(s){return s.id==S.cur}))S.cur=null;S.edit=null;render()}
function keepLocal(j){SY.conf=null;SY.rev=j.rev;SY.dirty=true;SY.v++;sySave();SY.status="saving";syUi();syPush()}
function syConflict(j){if(!j.data){keepLocal(j);return}SY.status="conflict";SY.conf=j;syUi();syAsk()}
function syAsk(){var j=SY.conf;if(!j)return;
 dlgOpen({title:"Deux versions différentes",text:"Les données de cet appareil et celles du serveur ne sont pas les mêmes. Laquelle veux-tu garder ? L’autre sera remplacée.",ok:"Utiliser le serveur",alt:"Garder cet appareil",cb:function(){applyRemote(j)},altCb:function(){keepLocal(j)}})}
function syBadCode(){SY.code="";SY.status="off";SY.msg="Code d’accès incorrect.";SY.rev=0;SY.dirty=false;SY.conf=null;sySave();render()}
function doExport(){var d=new Date(),b=new Blob([JSON.stringify({app:"seances",version:3,date:d.toISOString(),data:snap()},null,1)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download="sauvegarde-seances-"+d.toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500)}
document.addEventListener("visibilitychange",function(){if(document.visibilityState!="visible"||!SY.code||S.ro)return;if(SY.dirty)syPush();else if(!S.edit&&!S.modal)syPull()});
window.addEventListener("online",function(){if(!SY.code||S.ro)return;if(SY.dirty)syPush();else syPull()});
document.addEventListener("keydown",function(ev){if(ev.key=="Enter"&&ev.target.id=="sy-code"){ev.preventDefault();var b=document.querySelector('[data-a="syOn"]');if(b)b.click()}});
document.addEventListener("change",function(ev){var t=ev.target;if(t.id!="imp-file"||!t.files||!t.files[0])return;
 var r=new FileReader();r.onload=function(){var d,st=document.getElementById("bk-st");try{d=JSON.parse(r.result);if(d&&d.data)d=d.data}catch(e){d=null}
  t.value="";
  if(!d||!Array.isArray(d.lib)||!Array.isArray(d.sessions)){if(st)st.textContent="Fichier non reconnu.";return}
  dlgOpen({title:"Importer cette sauvegarde ?",text:d.lib.length+" exercice(s) et "+d.sessions.length+" séance(s). Les données actuelles seront remplacées.",ok:"Importer",danger:true,cb:function(){S.lib=d.lib;S.sessions=d.sessions;S.folders=Array.isArray(d.folders)?d.folders:[];S.lib.forEach(function(e){if(!e.tags)e.tags=[];if(!e.players)e.players=[]});S.cur=null;S.edit=null;save()}})};
 r.readAsText(t.files[0])});
/* SYNC END */
document.getElementById("tabs").innerHTML='<button data-tab="ses">'+ic("ses",22)+"Séances</button><button data-tab=\"lib\">"+ic("lib",22)+"Bibliothèque</button><button data-tab=\"set\">"+ic("sliders",22)+"Réglages</button>";
load();syLoad();render();if(SY.code&&!S.ro)syPull();
</script></body></html>
