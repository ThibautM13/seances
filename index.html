<style>
/* Concept : appli d'entraînement claire, cartes blanches sur fond gris très clair. Titres et chiffres condensés façon tableau d'affichage, vidéo en vedette, barre d'onglets en bas. */
:root{
 --bg:#f3f5f8;--s1:#ffffff;--s2:#eef1f5;--ln:#dfe4ea;
 --tx:#14202e;--mu:#5f6c7b;--ac:#2563eb;--danger:#d33a3a;
 --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
 --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
 color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:600;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
h1{font-size:36px}h2{font-size:22px}h3{font-size:20px}
.wrap{max-width:none;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}@media(min-width:900px){.wrap:not(.nar){padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
.wrap.ro{padding-bottom:40px}
.wrap.nar{max-width:760px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ac)}
.mu{color:var(--mu);font-size:13px}
.pre{white-space:pre-line}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top .mu{margin-top:4px}
.lg{display:block;height:34px;width:auto;flex:none}.top .lg{margin-left:auto}.hero{position:relative}.hero .lg{position:absolute;top:12px;right:12px;height:32px;background:#fff;padding:4px 8px;border-radius:10px}.hero h1{padding-right:110px}.pbrk .hero .lg{display:none}.pbrk .hero h1{padding-right:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:1px solid transparent;border-radius:12px;background:var(--ac);color:#fff;font-weight:600}
.btn.ghost{background:var(--s2);border-color:var(--ln);color:var(--tx)}
.btn.dg{background:var(--danger);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);flex:none}
.ib.dg{color:var(--danger)}
.ic{flex:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--s2);color:var(--tx);font:inherit;font-size:16px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1;min-width:0}
.sb{position:relative}
.sb .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu)}
.sb input{padding-left:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.multi{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;background:hsl(var(--h) 70% 50%/.13);color:hsl(var(--h) 70% 28%)}
.tg::before{content:"";width:6px;height:6px;border-radius:50%;background:hsl(var(--h) 75% 45%)}
.tg.pp{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}
.tg.pp::before{display:none}
.seg{display:flex;flex:1;padding:4px;background:var(--s2);border:1px solid var(--ln);border-radius:14px;gap:4px}
.seg button{flex:1;padding:8px;border:0;border-radius:10px;background:transparent;color:var(--mu);font-weight:600}
.seg button.on{background:var(--ac);color:#fff}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.media{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#dde6f2,#c9d6e6);flex:none;color:#fff}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media.sm{width:84px}
.media.sm .pl{width:30px;height:30px;padding-left:2px}.media.sm .pl svg{width:15px;height:15px}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(13,17,23,.62);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;color:#fff;padding-left:3px}
.fol{margin-bottom:22px;border-radius:16px;width:100%}
.fh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fh h2{flex:1;min-width:0;overflow-wrap:anywhere}
.fh>.ic{color:var(--ac)}
.cnt{font-size:13px;color:var(--mu);background:var(--s2);border-radius:999px;padding:2px 9px}
.srow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:10px 10px 10px 14px;margin-bottom:8px}
.sbody{flex:1 1 150px;min-width:0;text-align:left;background:none;border:0;padding:6px 0;color:inherit}
.sbody h3{overflow-wrap:anywhere}
.sact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
select.mv{width:auto;max-width:150px;padding:8px 10px;font-size:14px}
.card,.xc,.lc,.srow{box-shadow:0 1px 2px rgba(20,32,46,.06),0 4px 14px rgba(20,32,46,.04)}
.empty{border:1px dashed var(--ln);border-radius:16px;padding:20px;text-align:center;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lc{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mw{position:relative}
.mo{position:absolute;top:5px;right:5px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:rgba(255,255,255,.9);color:var(--tx);box-shadow:0 1px 4px rgba(20,32,46,.25)}
.lc .lb{display:flex;flex-direction:column;gap:3px;padding:2px 4px 4px;min-width:0;cursor:pointer;flex:1}
.lc h3{font-size:17px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lpl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mu);min-width:0}
.lpl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltg{display:flex;gap:4px;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.ltg .tg{flex:none;padding:1px 8px;font-size:11px}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.menu .btn{justify-content:flex-start}
.menu .dgt{color:var(--danger)}
.ban{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff4e5;border:1px solid #f1c27a;color:#5b3a00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.ban:empty{display:none}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:8px}
.rows .srow{margin-bottom:0}
.sg2{margin-left:0!important;width:20px}.snote{margin-top:8px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.fpage .sgrip{display:none}.fpage .srow{padding-left:14px}
.xlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(480px,100%),1fr));gap:12px;align-items:start;margin-bottom:12px}
.xlist .card{margin-bottom:0}
.cap{max-width:760px}
.lock{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px;text-align:center}
.lock h1{font-size:36px}
.lk-ic{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 4px}
.lock input{text-align:center}
.lk-msg{min-height:20px;color:var(--danger);font-size:14px}
.sub{display:flex;gap:4px;padding:4px;background:var(--s2);border:1px solid var(--ln);border-radius:14px;max-width:360px;margin-bottom:16px}
.sub button{flex:1;padding:8px;border:0;border-radius:10px;background:transparent;color:var(--mu);font-weight:600}
.sub button.on{background:var(--ac);color:#fff}
.fh.tgl{cursor:pointer;padding:4px 0;border-radius:12px}
.fh.tgl:hover h2{color:var(--ac)}

var TM={end:0,total:0,n:"",on:false,done:false,iv:null,ctx:null,wl:null};
function tmBeep(){try{var c=TM.ctx;if(!c)return;[0,.28,.56].forEach(function(dl){var o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(c.destination);o.start(c.currentTime+dl);o.stop(c.currentTime+dl+.18)})}catch(e){}try{if(navigator.vibrate)navigator.vibrate([250,120,250,120,250])}catch(e){}}
function tmStart(sec,name,kind){if(!(sec>0))return;
 try{var AC=window.AudioContext||window.webkitAudioContext;if(AC){if(!TM.ctx)TM.ctx=new AC();if(TM.ctx.resume)TM.ctx.resume()}}catch(e){}
 try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request("screen").then(function(w){TM.wl=w},function(){})}catch(e){}
 TM.total=sec*1000;TM.end=Date.now()+TM.total;TM.n=name||"";TM.k=kind||"Repos";TM.on=true;TM.done=false;
 var el=document.getElementById("tmr");el.className=S.ro?"ro":"";el.hidden=false;
 el.innerHTML='<div class="tr"><div class="tt" id="tm-t"></div><div class="tl" id="tm-l"></div><button data-a="tmAdd">+15 s</button><button data-a="tmStop" id="tm-x">Arrêter</button></div><div class="pg" id="tm-p"></div>';
 clearInterval(TM.iv);TM.iv=setInterval(tmTick,250);tmTick()}
function tmStop(){TM.on=false;clearInterval(TM.iv);var el=document.getElementById("tmr");el.hidden=true;el.innerHTML="";try{if(TM.wl){TM.wl.release();TM.wl=null}}catch(e){}}
function tmTick(){if(!TM.on)return;var left=TM.end-Date.now(),el=document.getElementById("tmr");
 if(left<=0){if(!TM.done){TM.done=true;el.className=(S.ro?"ro ":"")+"done";tmBeep();TM.fin=Date.now()}
  document.getElementById("tm-t").textContent="0:00";document.getElementById("tm-l").textContent=(TM.k=="Effort"?"Temps écoulé !":"Repos terminé. C’est reparti !");document.getElementById("tm-x").textContent="OK";document.getElementById("tm-p").style.width="0";
  if(Date.now()-TM.fin>8000)tmStop();return}
 if(TM.done){TM.done=false;el.className=S.ro?"ro":"";document.getElementById("tm-x").textContent="Arrêter"}
 var sec=Math.ceil(left/1000);document.getElementById("tm-t").textContent=Math.floor(sec/60)+":"+("0"+sec%60).slice(-2);
 document.getElementById("tm-l").textContent=TM.k+(TM.n?" · "+TM.n:"");document.getElementById("tm-p").style.width=Math.max(0,left/TM.total*100)+"%"}
document.addEventListener("visibilitychange",function(){if(TM.on)tmTick()});
window.addEventListener("afterprint",function(){if(S.printP){S.printP=false;render()}});
