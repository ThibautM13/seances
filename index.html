 if(t.id=="pk-q"){S.pk.q=t.value;document.getElementById("pk-list").innerHTML=pkList();return}
 if(t.id=="ps-q"){S.pq=t.value;document.getElementById("ps-list").innerHTML=psList();return}
 if(!S.ro&&S.curP&&!S.cur){var pr=curPr();if(pr){if(t.id=="p-title"){pr.title=t.value;save()}else if(t.id=="p-player"){pr.player=t.value;save()}else if(t.dataset&&t.dataset.pl!=null&&pr.items[+t.dataset.pl]){pr.items[+t.dataset.pl].label=t.value;save()}}return}
 var s=curS();if(!s||S.ro)return;
 if(t.id=="s-title"){s.title=t.value;save()}
 else if(t.id=="s-player"){s.player=t.value;save()}
 else if(t.id=="s-folder"){s.folder=t.value;save()}
 else if(t.dataset&&t.dataset.k){s.items[+t.dataset.i][t.dataset.k]=t.value;save()}});
document.addEventListener("change",function(ev){var t=ev.target;if(t.classList&&t.classList.contains("mv")&&t.value!==""){moveSes(+t.dataset.id,t.value=="__none"?"":t.value)}});
document.addEventListener("keydown",function(ev){var t=ev.target;
 if(ev.key=="Escape"&&S.modal){S.modal=S.modal.ret||null;dlgCb=null;render();return}
 if(ev.key=="Enter"&&t.id=="f-newtag"){ev.preventDefault();addTag();return}
 if(ev.key=="Enter"&&t.id=="f-newplayer"){ev.preventDefault();addPlayer();return}
 if(ev.key=="Enter"&&t.id=="dlg-in"){ev.preventDefault();var b=document.querySelector('[data-a="dlgOk"]');if(b)b.click();return}
 if((ev.key=="Enter"||ev.key==" ")&&t.getAttribute&&["tog","editEx","togF"].indexOf(t.getAttribute("data-a"))>-1){ev.preventDefault();t.click()}});
document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName=="IMG"&&t.dataset&&t.dataset.yt)t.remove()},true);
document.addEventListener("dragstart",function(ev){var c=ev.target.closest&&ev.target.closest("[data-sid]");if(!c)return;dragId=+c.dataset.sid;try{ev.dataTransfer.setData("text/plain",String(dragId));ev.dataTransfer.effectAllowed="move"}catch(e){}});
document.addEventListener("dragover",function(ev){if(dragId==null)return;var d=ev.target.closest("[data-drop]");if(!d)return;ev.preventDefault();document.querySelectorAll("[data-drop]").forEach(function(x){x.style.outline=""});d.style.outline="2px dashed var(--ac)";d.style.outlineOffset="4px"});
document.addEventListener("drop",function(ev){if(dragId==null)return;var d=ev.target.closest("[data-drop]");if(!d)return;ev.preventDefault();var id=dragId;dragId=null;moveSes(id,d.getAttribute("data-drop"))});
document.addEventListener("dragend",function(){dragId=null;document.querySelectorAll("[data-drop]").forEach(function(x){x.style.outline=""})});
/* SYNC START */
var SY={code:"",rev:0,dirty:false,v:0,status:"off",msg:"",conf:null,busy:false,last:0,timer:null},SYK="seances-sync";
function syLoad(){try{var o=JSON.parse(localStorage.getItem(SYK)||"null");if(o){SY.code=o.code||"";SY.rev=o.rev||0;SY.dirty=!!o.dirty}}catch(e){}SY.status=SY.code?"idle":"off"}
function sySave(){try{localStorage.setItem(SYK,JSON.stringify({code:SY.code,rev:SY.rev,dirty:SY.dirty}))}catch(e){}}
function syApi(method,body){
 var o={method:method,headers:{"x-code":SY.code}};
 if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
 return fetch("/.netlify/functions/data",o).then(function(r){return r.json().catch(function(){return{}}).then(function(j){return{st:r.status,j:j}})})}
function errMsg(r){return r.st==404?"La synchronisation n’est pas encore installée sur le site.":((r.j&&r.j.error)||"Erreur du serveur.")}
function hm(t){try{return new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function banner(){if(!SY.code)return"";
 if(SY.status=="conflict")return'<div class="ban"><span>Deux versions différentes de ta bibliothèque existent.</span><button class="btn sm" data-a="syResolve">Choisir</button></div>';
 if(SY.status=="offline")return'<div class="ban"><span>Hors ligne : tes modifications sont gardées sur cet appareil et seront envoyées dès que possible.</span><button class="btn ghost sm" data-a="syNow">Réessayer</button></div>';
 if(SY.status=="error")return'<div class="ban"><span>'+esc(SY.msg||"Erreur de synchronisation.")+'</span><button class="btn ghost sm" data-a="syNow">Réessayer</button></div>';
 return""}
function syPanel(){
 var map={ok:["ok","À jour"],saving:["wait","Enregistrement…"],idle:["wait","Connexion…"],offline:["bad","Hors ligne, en attente de réseau"],error:["bad",SY.msg||"Erreur de synchronisation"],conflict:["bad","Deux versions différentes"]},st=map[SY.status]||["wait",""];
 return'<div style="display:flex;align-items:center;margin-bottom:8px"><span class="sd '+st[0]+'"></span><b>'+esc(st[1])+"</b></div>"+(SY.last&&SY.status=="ok"?'<div class="mu" style="margin-bottom:10px">Dernière synchronisation à '+hm(SY.last)+"</div>":"")
 +'<div class="acts" style="margin-bottom:0"><button class="btn ghost sm" data-a="syNow">Synchroniser maintenant</button>'+(SY.status=="conflict"?'<button class="btn sm" data-a="syResolve">Résoudre</button>':"")+"</div>"}
function lockView(){return'<form id="lk-form" class="lock"><div class="lk-ic">'+ic("lock",30)+'</div><h1>Prépa physique</h1><p class="mu" style="margin:0">Entre ton mot de passe pour ouvrir l’appli.</p><input id="lk-code" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" placeholder="Mot de passe" aria-label="Mot de passe"><button class="btn" type="submit" id="lk-go">Ouvrir</button><div id="lk-msg" class="lk-msg" role="alert">'+esc(SY.msg||"")+"</div></form>"}
function tryUnlock(){var inp=document.getElementById("lk-code"),cd=(inp.value||"").trim(),msg=document.getElementById("lk-msg"),bt=document.getElementById("lk-go");if(!cd)return;
 bt.disabled=true;msg.style.color="var(--mu)";msg.textContent="Vérification…";var prev=SY.code;SY.code=cd;
 var fail=function(t){SY.code=prev;bt.disabled=false;msg.style.color="";msg.textContent=t};
 syApi("GET").then(function(r){
  if(r.st==401){fail("Mot de passe incorrect.");inp.select();return}
  if(r.st!=200){fail(errMsg(r));return}
  SY.rev=0;SY.dirty=false;SY.msg="";SY.conf=null;SY.busy=false;SY.status="idle";sySave();S.locked=false;render();syMerge(r.j);syUi()}).catch(function(){fail("Impossible de joindre le serveur. Vérifie ta connexion.")})}
document.addEventListener("submit",function(ev){if(ev.target&&ev.target.id=="lk-form"){ev.preventDefault();tryUnlock()}});
function syUi(){var b=document.getElementById("sy-ban");if(b)b.innerHTML=banner();var p=document.getElementById("sy-set");if(p)p.innerHTML=syPanel()}
function setView(){
 return'<div class="top"><div><h1>Réglages</h1></div></div>'
 +'<div class="card"><h2>Synchronisation</h2><p class="mu" style="margin:6px 0 12px">Tout est enregistré en ligne automatiquement, et tu retrouves ta bibliothèque et tes séances sur tous tes appareils.</p><div id="sy-set">'+syPanel()+"</div></div>"
 +'<div class="card"><h2>Mot de passe</h2><p class="mu" style="margin:6px 0 12px">L’appli demande ton mot de passe à l’ouverture. Les joueurs n’en ont pas besoin pour voir les séances que tu leur envoies.</p><button class="btn ghost sm" data-a="lock">'+ic("lock",16)+'Verrouiller cet appareil</button></div>'
 +'<div class="card"><h2>Sauvegarde</h2><p class="mu" style="margin:6px 0 12px">Télécharge un fichier avec toute ta bibliothèque, tes séances et tes dossiers, ou restaure une sauvegarde.</p><div class="acts" style="margin-bottom:0"><button class="btn ghost sm" data-a="export">Exporter</button><button class="btn ghost sm" data-a="import">Importer</button></div><input id="imp-file" type="file" accept=".json,application/json" hidden><div class="mu" id="bk-st" style="margin-top:8px"></div></div>'}
function syDirty(){if(!SY.code||S.ro)return;SY.dirty=true;SY.v++;sySave();if(SY.status!="conflict")SY.status="saving";clearTimeout(SY.timer);SY.timer=setTimeout(syPush,1500)}
function syPush(){
 if(!SY.code||SY.busy||!SY.dirty||SY.conf)return;
 var v0=SY.v;SY.busy=true;SY.status="saving";syUi();
 syApi("PUT",{baseRev:SY.rev,data:snap()}).then(function(r){SY.busy=false;
  if(r.st==200){SY.rev=r.j.rev;SY.dirty=(SY.v!==v0);SY.status="ok";SY.last=Date.now();sySave();if(SY.dirty){clearTimeout(SY.timer);SY.timer=setTimeout(syPush,800)}}
  else if(r.st==409){syConflict(r.j)}
  else if(r.st==401){syBadCode()}
  else{SY.status="error";SY.msg=errMsg(r)}
  syUi()}).catch(function(){SY.busy=false;SY.status="offline";syUi()})}
function syPull(){
 if(!SY.code||SY.busy||SY.conf)return;
 SY.busy=true;if(SY.status!="ok")SY.status="idle";syUi();
 syApi("GET").then(function(r){SY.busy=false;
  if(r.st==401)syBadCode();
  else if(r.st!=200){SY.status="error";SY.msg=errMsg(r)}
  else syMerge(r.j);
  syUi()}).catch(function(){SY.busy=false;SY.status="offline";syUi()})}
function syMerge(j){
 var hasLocal=S.lib.length||S.sessions.length||S.folders.length||S.programs.length;
 if(!j.data){SY.rev=j.rev;if(hasLocal){SY.dirty=true;SY.v++;sySave();syPush()}else{SY.status="ok";SY.last=Date.now();sySave()}return}
 if(j.rev===SY.rev){if(SY.dirty)syPush();else{SY.status="ok";SY.last=Date.now()}return}
 if(!SY.dirty&&(SY.rev>0||!hasLocal)){applyRemote(j);return}
 syConflict(j)}
function applyRemote(j){var d=j.data||{};S.lib=d.lib||[];S.sessions=d.sessions||[];S.folders=d.folders||[];S.programs=d.programs||[];
 S.lib.forEach(function(e){if(!e.tags)e.tags=[];if(!e.players)e.players=[]});
 try{localStorage.setItem(KEY,JSON.stringify(snap()))}catch(e){}
 SY.conf=null;SY.rev=j.rev;SY.dirty=false;SY.status="ok";SY.last=Date.now();sySave();
 if(S.cur&&!S.sessions.some(function(s){return s.id==S.cur}))S.cur=null;if(S.curP&&!S.programs.some(function(p){return p.id==S.curP}))S.curP=null;S.edit=null;render()}
function keepLocal(j){SY.conf=null;SY.rev=j.rev;SY.dirty=true;SY.v++;sySave();SY.status="saving";syUi();syPush()}
function syConflict(j){if(!j.data){keepLocal(j);return}SY.status="conflict";SY.conf=j;syUi();syAsk()}
function syAsk(){var j=SY.conf;if(!j)return;
 dlgOpen({title:"Deux versions différentes",text:"Les données de cet appareil et celles du serveur ne sont pas les mêmes. Laquelle veux-tu garder ? L’autre sera remplacée.",ok:"Utiliser le serveur",alt:"Garder cet appareil",cb:function(){applyRemote(j)},altCb:function(){keepLocal(j)}})}
function syBadCode(){SY.code="";SY.status="off";SY.msg="Le mot de passe n’est plus valide. Entre le nouveau.";S.locked=true;SY.rev=0;SY.dirty=false;SY.conf=null;sySave();render()}
function doExport(){var d=new Date(),b=new Blob([JSON.stringify({app:"seances",version:3,date:d.toISOString(),data:snap()},null,1)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download="sauvegarde-seances-"+d.toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500)}
document.addEventListener("visibilitychange",function(){if(document.visibilityState!="visible"||!SY.code||S.ro)return;if(SY.dirty)syPush();else if(!S.edit&&!S.modal)syPull()});
window.addEventListener("focus",function(){if(!SY.code||S.ro||S.locked)return;if(SY.dirty)syPush();else if(!S.edit&&!S.modal)syPull()});
window.addEventListener("online",function(){if(!SY.code||S.ro)return;if(SY.dirty)syPush();else syPull()});
document.addEventListener("change",function(ev){var t=ev.target;if(t.id!="imp-file"||!t.files||!t.files[0])return;
 var r=new FileReader();r.onload=function(){var d,st=document.getElementById("bk-st");try{d=JSON.parse(r.result);if(d&&d.data)d=d.data}catch(e){d=null}
  t.value="";
  if(!d||!Array.isArray(d.lib)||!Array.isArray(d.sessions)){if(st)st.textContent="Fichier non reconnu.";return}
  dlgOpen({title:"Importer cette sauvegarde ?",text:d.lib.length+" exercice(s) et "+d.sessions.length+" séance(s). Les données actuelles seront remplacées.",ok:"Importer",danger:true,cb:function(){S.lib=d.lib;S.sessions=d.sessions;S.folders=Array.isArray(d.folders)?d.folders:[];S.programs=Array.isArray(d.programs)?d.programs:[];S.lib.forEach(function(e){if(!e.tags)e.tags=[];if(!e.players)e.players=[]});S.cur=null;S.curP=null;S.edit=null;save()}})};
 r.readAsText(t.files[0])});
/* SYNC END */
/* CHRONO DE REPOS */
var TM={end:0,total:0,n:"",on:false,done:false,iv:null,ctx:null,wl:null};
function tmBeep(){try{var c=TM.ctx;if(!c)return;[0,.28,.56].forEach(function(dl){var o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(c.destination);o.start(c.currentTime+dl);o.stop(c.currentTime+dl+.18)})}catch(e){}try{if(navigator.vibrate)navigator.vibrate([250,120,250,120,250])}catch(e){}}
function tmStart(sec,name,kind){if(!(sec>0))return;
 try{var AC=window.AudioContext||window.webkitAudioContext;if(AC){if(!TM.ctx)TM.ctx=new AC();if(TM.ctx.resume)TM.ctx.resume()}}catch(e){}
 try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request("screen").then(function(w){TM.wl=w},function(){})}catch(e){}
 TM.total=sec*1000;TM.end=Date.now()+TM.total;TM.n=name||"";TM.k=kind||"Repos";TM.on=true;TM.done=false;
 var el=document.getElementById("tmr");el.className=S.ro?"ro":"";el.hidden=false;
 el.innerHTML='<div class="tr"><div class="tt" id="tm-t"></div><div class="tl" id="tm-l"></div><button data-a="tmAdd">+15 s</button><button data-a="tmStop" id="tm-x">Arrêter</button></div><div class="pg" id="tm-p"></div>';
 clearInterval(TM.iv);TM.iv=setInterval(tmTick,250);tmTick()}
function tmStop(){TM.on=false;clearInterval(TM.iv);var el=document.getElementById("tmr");el.hidden=true;el.innerHTML="";try{if(TM.wl){TM.wl.release();TM.wl=null}}catch(e){}}
function tmTick(){if(!TM.on)return;var left=TM.end-Date.now(),el=document.getElementById("tmr");
 if(left<=0){if(!TM.done){TM.done=true;el.className=(S.ro?"ro ":"")+"done";tmBeep();TM.fin=Date.now()}
  document.getElementById("tm-t").textContent="0:00";document.getElementById("tm-l").textContent=(TM.k=="Effort"?"Temps écoulé !":"Repos terminé. C’est reparti !");document.getElementById("tm-x").textContent="OK";document.getElementById("tm-p").style.width="0";
  if(Date.now()-TM.fin>8000)tmStop();return}
 if(TM.done){TM.done=false;el.className=S.ro?"ro":"";document.getElementById("tm-x").textContent="Arrêter"}
 var sec=Math.ceil(left/1000);document.getElementById("tm-t").textContent=Math.floor(sec/60)+":"+("0"+sec%60).slice(-2);
 document.getElementById("tm-l").textContent=TM.k+(TM.n?" · "+TM.n:"");document.getElementById("tm-p").style.width=Math.max(0,left/TM.total*100)+"%"}
document.addEventListener("visibilitychange",function(){if(TM.on)tmTick()});
window.addEventListener("afterprint",function(){if(S.printP){S.printP=false;render()}});
document.getElementById("tabs").innerHTML='<button data-tab="ses">'+ic("ses",22)+"Séances</button><button data-tab=\"lib\">"+ic("lib",22)+"Bibliothèque</button><button data-tab=\"set\">"+ic("sliders",22)+"Réglages</button>";
load();syLoad();S.locked=!S.ro&&!SY.code;render();if(SY.code&&!S.ro)syPull();
</script></body></html>
